services:
  # Interactive CLI mode for manual stock checking
  stock-checker:
    build: .
    container_name: ai-stock-checker
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    network_mode: host
    stdin_open: true
    tty: true

  # Primary service: market scan + paper trading with persistence
  intelligent-trader:
    build: .
    platform: linux/arm64
    container_name: intelligent-trader
    volumes:
      - ./stock_checker:/app/stock_checker
      - ./data:/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemma4:latest}
      - AI_MULTI_ROLE=${AI_MULTI_ROLE:-1}
      - AI_VERBOSE=${AI_VERBOSE:-0}
      - REGIME_GATE=${REGIME_GATE:-1}
    restart: unless-stopped
    # Anti-churn defaults: scan every 15m, trade every 5m, hold ≥4h
    command: >
      python3 -u -m stock_checker.intelligent_trader
      --capital 100000
      --scan-interval 900
      --trade-interval 300
      --max-positions 8
      --position-size 0.10
      --min-hold-time 14400
      --ai-mode ${AI_MODE:-off}
      --ai-model ${AI_MODEL:-gemma4:latest}
      --top-crypto-count 2

  # OpenBB Workspace custom backend (portfolio / trades / opportunities)
  openbb-backend:
    build: .
    container_name: openbb-backend
    ports:
      - "7779:7779"
    volumes:
      - ./openbb_backend:/app/openbb_backend
      - ./data:/data
      - ./.git:/git:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/data
      - OPENBB_BACKEND_API_KEY=${OPENBB_BACKEND_API_KEY:-}
      - DESK_GIT_DIR=/git
      - DESK_REPO_URL=https://github.com/raro42/ai-stock-checker
      - REGIME_GATE=${REGIME_GATE:-1}
    restart: unless-stopped
    command: >
      python3 -m uvicorn openbb_backend.main:app
      --host 0.0.0.0
      --port 7779
      --reload
      --reload-dir /app/openbb_backend

  # Monitor-only (signals, no trades)
  monitor:
    build: .
    container_name: ai-stock-monitor
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    restart: unless-stopped
    profiles:
      - monitor
    command: >
      python3 -u -m stock_checker.monitor
      --interval 900
